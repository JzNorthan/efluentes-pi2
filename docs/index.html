<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A1F">
<title>Efluentes PI2 — Panel de control</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="config.js"></script>
<script src="app.js" defer></script>
</head>
<body>

<!-- Acceso -->
<main id="acceso" class="acceso">
  <form id="form-acceso" autocomplete="on">
    <h1>Efluentes PI2</h1>
    <p class="tenue" style="margin:0">Panel de control del prototipo. Ingresa con el usuario del panel en el broker.</p>
    <label class="campo"><span class="tenue">Usuario</span><input id="acc-usuario" name="username" autocomplete="username" required></label>
    <label class="campo"><span class="tenue">Contraseña</span><input id="acc-clave" name="password" type="password" autocomplete="current-password" required></label>
    <label class="check"><input id="acc-recordar" type="checkbox" checked> Recordar en este dispositivo</label>
    <button class="btn btn-primario" type="submit">Conectar</button>
    <p id="acc-error" class="c-noapta oculto" role="alert" style="margin:0"></p>
  </form>
</main>

<!-- Aplicación -->
<div id="app" class="app oculto">
  <nav class="lateral" aria-label="Secciones" id="nav-lateral"></nav>
  <main class="contenido" id="contenido">
    <header class="barra">
      <h1 id="titulo">Centro de control</h1>
      <div class="chips" id="chips"></div>
    </header>
    <div id="aviso-conexion" class="aviso oculto" role="status"></div>
    <section id="vista" aria-live="off"></section>
  </main>
  <nav class="nav-inferior" aria-label="Secciones" id="nav-inferior"></nav>
</div>

<dialog id="dlg-confirmar">
  <h2 id="dlg-titulo">¿Confirmar?</h2>
  <p id="dlg-texto" class="tenue"></p>
  <div class="acciones">
    <button class="btn btn-borde" type="button" data-cerrar>Cancelar</button>
    <button class="btn btn-primario" type="button" id="dlg-ok">Confirmar</button>
  </div>
</dialog>

<dialog id="dlg-marca">
  <h2>Agregar marca</h2>
  <p class="tenue">Queda en las gráficas y en el registro, para todos los que tengan el panel abierto.</p>
  <label class="campo"><span class="tenue">Descripción</span><input id="marca-texto" maxlength="60" placeholder="Ej.: muestra con tierra"></label>
  <div class="acciones">
    <button class="btn btn-borde" type="button" data-cerrar>Cancelar</button>
    <button class="btn btn-primario" type="button" id="marca-ok">Agregar marca</button>
  </div>
</dialog>

<div class="avisos" id="avisos" aria-live="polite"></div>
<div class="tooltip oculto" id="tooltip"></div>
</body>
</html>
